name: Lint-Test-Deploy
on: push
jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: lint
        run: eslint --ext .jsx --fix src
  
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Test
        run: vitest run

  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: vite build

    