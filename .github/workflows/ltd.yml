name: Lint-Test-Deploy
on: push
jobs:
  Dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependency
        run: npm install --save-dev eslint
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lint
        run: eslint --ext .jsx --fix src
  
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Test
        run: vitest run

  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: vite build

    